logLevel: info

# Keep the control API on the private camera_control Docker network only.
api: true
apiAddress: :9997

# Viewers must present a short-lived application-issued token. MediaMTX asks
# the API to validate both the token and the user's site permission.
authMethod: http
authHTTPAddress: http://api:3000/api/cameras/media-auth
authHTTPExclude: []

# RTSP sources can be pulled and remote cameras can publish authenticated RTMP paths.
rtsp: false
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8888
hlsAllowOrigins:
  - https://bikasheng.com.np
hlsDirectory: ""
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins:
  - https://bikasheng.com.np
webrtcLocalUDPAddress: :8189
# Keep the UDP path for normal low-latency playback and expose the same ICE
# port over TCP as a fallback for networks that block UDP.
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts:
  - 169.58.25.131
  - bikasheng.com.np
  - 2a02:c207:2364:8298::1

paths: {}
pathDefaults:
  # The pilot is live-only. HLS segments are transient in-memory transport buffers.
  record: false
